		<script src="/assets/js/ted-x-components.umd.min.js"></script>
		<script src="/assets/js/countdown.js"></script>

		<script>
		function hamburger_menu() {
			const navLinks = document.getElementById("nav-links");
			const navBarLinks = document.querySelector(".nav-bar__links");
			if (navLinks.className === "nav-links") {
				navLinks.className += " show-mobile-nav";
				navBarLinks.className += " nav-bar__links--open";
			} else {
				navLinks.className = "nav-links";
				navBarLinks.className = navBarLinks.className = "nav-bar__links";
			}
		}
		</script>

	{{ content }}
