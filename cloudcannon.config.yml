source: src
paths:
  uploads: uploads
collections_config:
  events:
    path: collections/_events
    name: Events
    icon: celebration
    disable_url: false
    preview:
      text:
        - text:
        - key: title
      subtext:
      icon:
      icon_color:
      icon_background_color:
      image:
        - key: hero.image
      metadata:
      gallery:
    _inputs:
      people:
        type: multichoice
        options:
          allow_create:
          allow_empty: true
          values:
          value_key: filename_without_ext
          preview:
            text:
              - key: name
            subtext:
            icon:
            icon_color:
            icon_background_color:
            image:
              - key: image
            metadata:
            gallery:
          required:
          required_message:
          min_items:
          min_items_message:
          max_items:
          max_items_message:
          empty_type:
        instance_value: NOW
        cascade: true
      event_partners:
        type: multiselect
        options:
          allow_create:
          allow_empty: true
          values:
          value_key: filename_without_ext
          preview:
          picker_preview:
          view:
          picker_view:
          required:
          required_message:
          min_length:
          min_length_message:
          max_length:
          max_length_message:
          pattern:
          pattern_message:
          min_graphemes:
          min_graphemes_message:
          max_graphemes:
          max_graphemes_message:
          min_words:
          min_words_message:
          max_words:
          max_words_message:
          locale:
          empty_type:
          min_items:
          min_items_message:
          max_items:
          max_items_message:
        cascade: true
    _select_data:
    _structures:
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
    schemas:
      default:
        path: schemas/events.md
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: true
        _inputs:
